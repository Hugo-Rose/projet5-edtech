[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long (géré par le formateur)
    "F401",   # unused import (faux positifs sur __init__.py)
    "UP007",  # X | Y syntax (compatibilité 3.10-)
]
exclude = ["notebooks/", ".venv/", "build/"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # redefinition of unused name (fixtures)
