services:
  postgres:
    image: postgres:15-alpine
    container_name: edtech_postgres
    environment:
      POSTGRES_USER: edtech
      POSTGRES_PASSWORD: edtech_pass
      POSTGRES_DB: edtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech -d edtech_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edtech_net

  mlflow:
    image: python:3.11-slim
    container_name: edtech_mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow psycopg2-binary boto3 --quiet &&
               mlflow server
               --backend-store-uri postgresql://edtech:edtech_pass@postgres:5432/edtech_db
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow/artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edtech_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: edtech_api
    environment:
      DATABASE_URL: postgresql://edtech:edtech_pass@postgres:5432/edtech_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - edtech_net
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: edtech_dashboard
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://edtech:edtech_pass@postgres:5432/edtech_db
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - api
    networks:
      - edtech_net
    command: streamlit run src/dashboard/app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  postgres_data:

networks:
  edtech_net:
    driver: bridge
